<% template "header" . %>

jobs:
  build:
<% template "matrix" . %>
    steps:
      - uses: actions/checkout@v7
      - name: Publish
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) rid=win-x64 ;;
            macOS) rid=osx-arm64 ;;
            *) rid=linux-x64 ;;
          esac
          dotnet publish -c Release -r "$rid" --self-contained true -p:PublishSingleFile=true -o dist
<% template "upload" . %>
<%- template "release" . %>
