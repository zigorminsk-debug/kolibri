<% template "header" . %>

jobs:
  build:
    name: Build (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          if [ -f Makefile ] || [ -f makefile ]; then make; fi
          mkdir -p dist
          rsync -a --exclude dist --exclude .git --exclude .github ./ dist/
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: <% .AppName %>-source
          path: dist/
          if-no-files-found: error
<%- template "release" . %>
