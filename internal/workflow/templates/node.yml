<% template "header" . %>

jobs:
  build:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: <% .AppName %>-web
          path: dist/
          if-no-files-found: error
<%- template "release" . %>
