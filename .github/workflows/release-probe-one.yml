# Этот файл создаёт и обновляет Kolibri Forge. Ручные правки будут перезаписаны.
name: Release probe one

on:
  push:
    branches: ["arena/acd8a9b9-kolibri"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-probe-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows, os: windows-latest }
    steps:
      - name: Build
        shell: bash
        run: |
          mkdir -p dist probe && cd probe
          printf 'package main\nfunc main(){}\n' > main.go
          go mod init probe && go build -o ../dist/ .
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: cslvpn-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Each artifact is fetched by name into a folder of its own: without a
      # name the layout depends on how many artifacts the run has.
      - name: Download cslvpn-windows
        uses: actions/download-artifact@v8
        with:
          name: cslvpn-windows
          path: artifacts/cslvpn-windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: tmp-probe-one-${{ github.run_number }}
          TITLE: "Сборка №${{ github.run_number }}"
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # A failure here is reported as an annotation, which Kolibri Forge
          # shows to the user: the build itself is good at this point.
          fail() {
            echo "::error title=Release::$(printf '%s' "$1" | tr '\r\n' '  ' | cut -c1-600 | sed 's/%/%25/g')"
            exit 1
          }
          cd artifacts || fail "The build left no files to publish."
          shopt -s nullglob
          # Artifacts lose the executable bit; restore it for binaries and scripts.
          find . -type f | while IFS= read -r f; do
            case "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" in
              7f454c46|cffaedfe|cafebabe|2321*) chmod +x "$f" ;;
            esac
          done
          for d in */; do
            d="${d%/}"
            (cd "$d" && zip -qr "../$d.zip" .) || fail "Could not pack $d."
          done
          archives=(./*.zip)
          [ "${#archives[@]}" -gt 0 ] || fail "The build left no files to publish."
          if ! out="$(gh release create "$TAG" "${archives[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes "${NOTES:-Автоматическая сборка}" 2>&1)"; then
            echo "$out"
            fail "$out"
          fi
          echo "$out"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: tmp-probe-one-${{ github.run_number }}
        run: |
          { echo "--- tree"; find artifacts -maxdepth 3 2>&1 | head -20; echo "--- release"; gh release view "$TAG" --json tagName,isDraft,assets --jq '.tagName, .isDraft, (.assets[] | "\(.name) \(.size)")' 2>&1; } > "$RUNNER_TEMP/report.txt" || true
          msg="$(sed 's/%/%25/g' "$RUNNER_TEMP/report.txt" | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=probe::$msg"
          gh release delete "$TAG" --cleanup-tag --yes || true
