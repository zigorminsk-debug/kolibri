# Собирает Kolibri Forge под Windows, Linux и macOS при каждом изменении.
# Для Windows кроме самой программы собирается установщик
# KolibriForge-Setup.exe. Готовые файлы лежат в артефактах запуска; для ветки
# main и тегов v* дополнительно публикуется релиз с прямыми ссылками.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FYNE_TOOLS: v1.7.4

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      # The "ci" tag swaps Fyne's OpenGL driver for the software one, so the
      # checks need no display and no system libraries.
      - name: Vet
        run: go vet -tags ci ./...
      - name: Test
        run: |
          set -o pipefail
          if ! go test -race -tags ci ./... 2>&1 | tee /tmp/test.out; then
            grep -E '(--- FAIL:|FAIL\t|\.go:[0-9]+:|WARNING: DATA RACE|panic:)' /tmp/test.out | head -n 15 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          fi
      - name: Test with Lightpanda
        if: always()
        run: |
          set -o pipefail
          lp="$RUNNER_TEMP/lightpanda"
          curl -fsSL --retry 3 -o "$lp" \
            https://github.com/lightpanda-io/browser/releases/download/1.0.4/lightpanda-x86_64-linux
          chmod +x "$lp"
          "$lp" version
          if ! LIGHTPANDA_TEST_BIN="$lp" go test -race -v -run 'TestRealLightpanda|TestRunWithRealLightpanda' ./internal/lightpanda ./internal/pipeline 2>&1 | tee /tmp/lp.out; then
            grep -E '(--- FAIL:|FAIL\t|\.go:[0-9]+:|WARNING: DATA RACE|panic:)' /tmp/lp.out | head -n 15 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, os: windows-latest }
          - { target: linux-amd64, os: ubuntu-latest }
          - { target: macos-arm64, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux libraries for Fyne
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev
      - name: Install the Fyne packaging tool
        run: go install "fyne.io/tools/cmd/fyne@$FYNE_TOOLS"
      - name: Stamp version
        env:
          BUILD: ${{ github.run_number }}
        run: |
          # The app shows these numbers in its settings window.
          sed -i.bak -E "s/^( *Build = ).*/\1$BUILD/" FyneApp.toml
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sed -i.bak -E "s/^( *Version = ).*/\1\"${GITHUB_REF_NAME#v}\"/" FyneApp.toml
          fi
          rm -f FyneApp.toml.bak
          cat FyneApp.toml
      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          fyne package --os windows --release
          mkdir -p dist
          7z a -tzip "dist/KolibriForge-${{ matrix.target }}.zip" "Kolibri Forge.exe"
      # Inno Setup входит в образ windows-latest; PowerShell — чтобы ключи
      # вида /DName=value не превращались в пути, как в Git Bash.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD: ${{ github.run_number }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The installer's file version takes numbers only: 1.2.0-beta -> 1.2.0.
          $version = '1.0.0'
          $line = Select-String -Path FyneApp.toml -Pattern '^\s*Version\s*=\s*"(\d+(?:\.\d+){0,2})'
          if ($line) { $version = $line.Matches[0].Groups[1].Value }
          & $iscc "/DAppVersion=$version" "/DAppBuild=$env:BUILD" "/DSourceExe=$PWD\Kolibri Forge.exe" "/O$PWD\dist" installer\kolibri-forge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\KolibriForge-Setup.exe | Format-List Name, Length
      # Устанавливает и удаляет программу на самом сборщике: установщик,
      # который не работает, не должен попасть в релиз.
      - name: Try the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kolibri-forge-install'
          $log = Join-Path $env:RUNNER_TEMP 'kolibri-forge-install.log'
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $setup = Start-Process -FilePath dist\KolibriForge-Setup.exe -Wait -PassThru `
            -ArgumentList ($quiet + '/CURRENTUSER', "/DIR=`"$dir`"", "/LOG=`"$log`"")
          if ($setup.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "the installer exited with code $($setup.ExitCode)"
          }
          $exe = Join-Path $dir 'Kolibri Forge.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Kolibri Forge.lnk'
          foreach ($path in $exe, (Join-Path $dir 'unins000.exe'), $shortcut) {
            if (-not (Test-Path $path)) { throw "the installer did not create $path" }
          }
          $info = (Get-Item $exe).VersionInfo
          "Installed: $($info.ProductName) $($info.ProductVersion), $((Get-Item $exe).Length) bytes"

          $remove = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList $quiet
          if ($remove.ExitCode -ne 0) { throw "the uninstaller exited with code $($remove.ExitCode)" }
          # The uninstaller finishes its work from a copy of itself.
          for ($i = 0; $i -lt 30 -and ((Test-Path $exe) -or (Test-Path $shortcut)); $i++) { Start-Sleep -Seconds 1 }
          if ((Test-Path $exe) -or (Test-Path $shortcut)) { throw 'the uninstaller left the program behind' }
          'Uninstalled cleanly.'
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p pack/KolibriForge dist
          fyne build --os linux --release -o pack/KolibriForge/kolibri-forge
          cp internal/ui/assets/icon.png pack/KolibriForge/kolibri-forge.png
          tar -C pack -czf "dist/KolibriForge-${{ matrix.target }}.tar.gz" KolibriForge
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          fyne package --os darwin --release
          # An ad-hoc signature keeps Gatekeeper from calling the app damaged.
          codesign --force --deep --sign - "Kolibri Forge.app"
          mkdir -p dist
          ditto -c -k --keepParent "Kolibri Forge.app" "dist/KolibriForge-${{ matrix.target }}.zip"
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: KolibriForge-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Kolibri Forge ${GITHUB_REF_NAME#v}" --generate-notes
          else
            gh release create "build-$RUN_NUMBER" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Kolibri Forge, сборка $RUN_NUMBER" \
              --notes "Автоматическая сборка из ветки main, коммит $GITHUB_SHA."
          fi
