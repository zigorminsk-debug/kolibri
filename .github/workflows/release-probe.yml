# Этот файл создаёт и обновляет Kolibri Forge. Ручные правки будут перезаписаны.
name: Release probe

on:
  push:
    branches: ["arena/acd8a9b9-kolibri"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-probe-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows, os: windows-latest }
    steps:
      - name: Build
        shell: bash
        run: |
          mkdir -p dist probe && cd probe
          printf 'package main\nfunc main(){}\n' > main.go
          go mod init probe && go build -o ../dist/ .
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: cslvpn-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: tmp-probe-${{ github.run_number }}
          TITLE: "Сборка №${{ github.run_number }}"
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          exec >"$RUNNER_TEMP/out.log" 2>&1
          set -x
          cd artifacts
          # Artifacts lose the executable bit; restore it for binaries and scripts.
          find . -type f | while IFS= read -r f; do
            case "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" in
              7f454c46|cffaedfe|cafebabe|2321*) chmod +x "$f" ;;
            esac
          done
          for d in */; do
            d="${d%/}"
            (cd "$d" && zip -qr "../$d.zip" .)
          done
          gh release create "$TAG" ./*.zip --target "$GITHUB_SHA" --title "$TITLE" --notes "${NOTES:-Автоматическая сборка}"
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: tmp-probe-${{ github.run_number }}
        run: |
          { echo "--- tree"; find artifacts -maxdepth 3 2>&1 | head -20; echo "--- tools"; command -v zip gh od head 2>&1; echo "--- log"; tail -c 2500 "$RUNNER_TEMP/out.log" 2>&1 | cat -A; } > "$RUNNER_TEMP/report.txt" || true
          msg="$(sed 's/%/%25/g' "$RUNNER_TEMP/report.txt" | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=probe::$msg"
          gh release delete "$TAG" --cleanup-tag --yes || true
