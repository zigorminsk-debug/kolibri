# Этот файл создаёт и обновляет Kolibri Forge. Ручные правки будут перезаписаны.
name: Probe Android

on:
  push:
    branches: ["arena/acd8a9b9-kolibri"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kolibri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: android, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Make the project
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          printf 'module example.com/probe\n\ngo 1.22\n' > go.mod
          cat > main.go <<'SRC'
          package main

          import (
              "fyne.io/fyne/v2/app"
              "fyne.io/fyne/v2/container"
              "fyne.io/fyne/v2/widget"
          )

          func main() {
              a := app.New()
              w := a.NewWindow("Probe")
              n := 0
              label := widget.NewLabel("0")
              w.SetContent(container.NewVBox(label, widget.NewButton("+1", func() {
                  n++
                  label.SetText(string(rune('0' + n%10)))
              })))
              w.ShowAndRun()
          }
          SRC
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install Linux libraries for Fyne
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev
      - name: Resolve dependencies
        run: go mod tidy
      - name: Build
        if: matrix.target != 'android'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          flags="-s -w"
          if [ "$RUNNER_OS" = "Windows" ]; then flags="$flags -H=windowsgui"; fi
          go build -trimpath -ldflags "$flags" -o dist/ ./...
      # The APK is signed with a debug key: it installs on a phone that allows
      # apps from unknown sources, but is not fit for Google Play.
      - name: Build for Android
        if: matrix.target == 'android'
        shell: bash
        env:
          APP_ID: io.github.zigorminsk_debug.probe_app
          APP_NAME: Probe-App
          BUILD: ${{ github.run_number }}
        run: |
          exec > >(tee "$RUNNER_TEMP/android.log") 2>&1
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ ! -d "$ndk" ] && [ -d "$sdk/ndk" ]; then
            ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ ! -d "$sdk" ] || [ ! -d "$ndk" ]; then
            echo "::error title=Android::The runner has no Android SDK or NDK (ANDROID_HOME, ANDROID_NDK_HOME)."
            exit 1
          fi
          export ANDROID_HOME="$sdk" ANDROID_NDK_HOME="$ndk"
          go install fyne.io/tools/cmd/fyne@v1.7.4

          # The package needs an icon: the project's own, or a plain one.
          icon=Icon.png
          if [ ! -f "$icon" ]; then
            declared=""
            if [ -f FyneApp.toml ]; then
              declared="$(sed -nE 's/^[[:space:]]*Icon[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' FyneApp.toml | head -n 1 || true)"
            fi
            if [ -n "$declared" ] && [ -f "$declared" ]; then
              icon="$declared"
            else
              mkdir -p "$RUNNER_TEMP/kolibri-icon"
              cat > "$RUNNER_TEMP/kolibri-icon/main.go" <<'ICON'
          package main

          import (
              "image"
              "image/color"
              "image/png"
              "os"
          )

          func main() {
              const n = 512
              dark, light := color.NRGBA{0x12, 0x1A, 0x17, 0xFF}, color.NRGBA{0x34, 0xD8, 0xA2, 0xFF}
              img := image.NewNRGBA(image.Rect(0, 0, n, n))
              for y := 0; y < n; y++ {
                  for x := 0; x < n; x++ {
                      c := dark
                      if d := (x-n/2)*(x-n/2) + (y-n/2)*(y-n/2); d < 170*170 && d > 90*90 {
                          c = light
                      }
                      img.SetNRGBA(x, y, c)
                  }
              }
              f, err := os.Create(os.Args[1])
              if err != nil {
                  panic(err)
              }
              if err := png.Encode(f, img); err != nil {
                  panic(err)
              }
              if err := f.Close(); err != nil {
                  panic(err)
              }
          }
          ICON
              (cd "$RUNNER_TEMP/kolibri-icon" && go mod init kolibri-icon >/dev/null 2>&1 && go run . "$GITHUB_WORKSPACE/Icon.png")
            fi
          fi

          # The project's own name wins; the identifier is always ours, so
          # that it is valid for Android whatever the project declares.
          # 64- and 32-bit ARM cover phones and tablets; the x86 builds are
          # only for emulators and would double the size of the APK.
          args=(--os "android/arm64,android/arm,android/amd64" --app-id "$APP_ID" --icon "$icon" --app-version "1.0.$BUILD" --app-build "$BUILD")
          if [ ! -f FyneApp.toml ] || ! grep -Eq '^[[:space:]]*Name[[:space:]]*=' FyneApp.toml; then
            args+=(--name "$APP_NAME")
          fi
          # Without debug information the package is about a third smaller.
          GOFLAGS="-ldflags=-w -trimpath" "$(go env GOPATH)/bin/fyne" package "${args[@]}"
          mkdir -p dist
          mv ./*.apk dist/
      - name: Report
        if: always() && matrix.target == 'android'
        shell: bash
        run: |
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            echo "NDK_LATEST=${ANDROID_NDK_LATEST_HOME:-} NDK_HOME=${ANDROID_NDK_HOME:-} NDK=${ANDROID_NDK:-}"
            go version
            tail -n 6 "$RUNNER_TEMP/android.log" 2>&1 || true
            ls -la dist 2>&1 || true
            ls -la . 2>&1 | head -20
            bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            for f in dist/*.apk; do
              [ -f "$f" ] || continue
              "$bt/aapt" dump badging "$f" 2>&1 | head -12
              unzip -l "$f" 2>&1 | tail -15
              "$bt/apksigner" verify --print-certs "$f" 2>&1 | head -6
            done
          } > report.txt 2>&1
          echo "::notice title=AndroidProbe::$(sed 's/%/%25/g' report.txt | cut -c1-300 | head -70 | awk '{printf "%s%%0A", $0}')"
      - name: Enable KVM
        if: matrix.target == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the emulator script
        if: matrix.target == 'android'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/emu.sh" <<'EMU'
          pkg=io.github.zigorminsk_debug.probe_app
          {
            adb install -r dist/*.apk
            adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "pid: $(adb shell pidof "$pkg")"
            adb shell dumpsys window | grep -E "mCurrentFocus" | head -3
            adb shell input tap 540 300
            sleep 2
            adb exec-out screencap -p > "$RUNNER_TEMP/screen.png"
            ls -l "$RUNNER_TEMP/screen.png"
            echo "pid after tap: $(adb shell pidof "$pkg")"
            adb logcat -d | grep -E "GoLog|Fyne|FATAL|AndroidRuntime|$pkg" | tail -25
          } > "$RUNNER_TEMP/emu.txt" 2>&1
          exit 0
          EMU
      - name: Run on an emulator
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash "$RUNNER_TEMP/emu.sh"
      - name: Report the emulator
        if: always() && matrix.target == 'android'
        shell: bash
        run: |
          echo "::notice title=Emulator::$(sed 's/%/%25/g' "$RUNNER_TEMP/emu.txt" | cut -c1-300 | head -60 | awk '{printf "%s%%0A", $0}')"
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY' || true
          import base64, io, os
          from PIL import Image
          img = Image.open(os.path.join(os.environ["RUNNER_TEMP"], "screen.png")).convert("RGB")
          img = img.resize((img.width // 3, img.height // 3)).quantize(24)
          buf = io.BytesIO()
          img.save(buf, "PNG", optimize=True)
          print("::notice title=Screen::" + base64.b64encode(buf.getvalue()).decode())
          PY
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Probe-App-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Each artifact is fetched by name into a folder of its own: without a
      # name the layout depends on how many artifacts the run has.
      - name: Download Probe-App-linux
        uses: actions/download-artifact@v8
        with:
          name: Probe-App-linux
          path: artifacts/Probe-App-linux
      - name: Download Probe-App-android
        uses: actions/download-artifact@v8
        with:
          name: Probe-App-android
          path: artifacts/Probe-App-android
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: tmp-probe-android-${{ github.run_number }}
          TITLE: "Сборка №${{ github.run_number }}"
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # A failure here is reported as an annotation, which Kolibri Forge
          # shows to the user: the build itself is good at this point.
          fail() {
            echo "::error title=Release::$(printf '%s' "$1" | tr '\r\n' '  ' | cut -c1-600 | sed 's/%/%25/g')"
            exit 1
          }
          cd artifacts || fail "The build left no files to publish."
          shopt -s nullglob
          # Artifacts lose the executable bit; restore it for binaries and scripts.
          find . -type f | while IFS= read -r f; do
            case "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" in
              7f454c46|cffaedfe|cafebabe|2321*) chmod +x "$f" ;;
            esac
          done
          for d in */; do
            d="${d%/}"
            apks=("$d"/*.apk)
            if [ "${#apks[@]}" -gt 0 ]; then
              # An APK is published as it is: a phone installs it directly.
              cp "${apks[@]}" . || fail "Could not copy the APK from $d."
              continue
            fi
            (cd "$d" && zip -qr "../$d.zip" .) || fail "Could not pack $d."
          done
          archives=(./*.zip ./*.apk)
          [ "${#archives[@]}" -gt 0 ] || fail "The build left no files to publish."
          if ! out="$(gh release create "$TAG" "${archives[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes "${NOTES:-Автоматическая сборка}" 2>&1)"; then
            echo "$out"
            fail "$out"
          fi
          echo "$out"
      - name: Report release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: tmp-probe-android-${{ github.run_number }}
        run: |
          out="$(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' 2>&1 || true)"
          echo "::notice title=AndroidRelease::$(printf '%s' "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          gh release delete "$TAG" --yes --cleanup-tag || true
